[project]
name = "tracon"
version = "0.1.0"
description = "Air traffic control for parallel Claude Code subagents: live TUI flags stuck, blocked, drifting agents, file conflicts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Josh Auriemma" }]
requires-python = ">=3.12"
dependencies = ["textual>=0.80"]
keywords = ["claude-code", "agents", "subagents", "tui", "monitoring", "textual"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.optional-dependencies]
# Judge through the Anthropic API (ANTHROPIC_API_KEY) instead of `claude -p`.
api = ["anthropic"]

[project.scripts]
tracon = "tracon.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
